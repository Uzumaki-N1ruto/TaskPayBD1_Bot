<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bangla Task Hub</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f7f7fb; }
    .bg-gradient-custom { background: linear-gradient(135deg, #8A2387 0%, #E94057 50%, #F27121 100%); }
    .btn-gradient { background: linear-gradient(135deg, #8A2387 0%, #E94057 100%); }
    .bg-profile-banner { background: linear-gradient(135deg, #8E2DE2 0%, #F000FF 50%, #FF512F 100%); }

    /* Button hover & touch scale transition */
    .btn-interactive {
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
    }
    .btn-interactive:hover {
      transform: scale(1.02);
    }
    .btn-interactive:active {
      transform: scale(0.95);
    }

    /* Spring / Overshoot Animations */
    @keyframes slideInOvershootLeft {
      0% { opacity: 0; transform: translateX(-60px); }
      70% { transform: translateX(12px); }
      100% { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideInOvershootRight {
      0% { opacity: 0; transform: translateX(60px); }
      70% { transform: translateX(-12px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    .animate-slide-left {
      animation: slideInOvershootLeft 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
    .animate-slide-right {
      animation: slideInOvershootRight 0.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style>
</head>
<body class="text-gray-800 pb-20 select-none overflow-x-hidden">

  <!-- DYNAMIC TAB CONTENT -->
  <main id="app-content" class="p-4 space-y-4 max-w-md mx-auto"></main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 flex justify-around py-2 max-w-md mx-auto shadow-lg z-50">
    <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-purple-600 text-xs font-medium btn-interactive">
      <i class="fa-solid fa-house text-lg mb-1"></i>Home
    </button>
    <button onclick="switchTab('earn')" id="nav-earn" class="flex flex-col items-center text-gray-400 text-xs font-medium btn-interactive">
      <i class="fa-solid fa-list-check text-lg mb-1"></i>Earn
    </button>
    <button onclick="switchTab('refer')" id="nav-refer" class="flex flex-col items-center text-gray-400 text-xs font-medium btn-interactive">
      <i class="fa-solid fa-users text-lg mb-1"></i>Refer
    </button>
    <button onclick="switchTab('withdraw')" id="nav-withdraw" class="flex flex-col items-center text-gray-400 text-xs font-medium btn-interactive">
      <i class="fa-solid fa-wallet text-lg mb-1"></i>Withdraw
    </button>
    <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center text-gray-400 text-xs font-medium btn-interactive">
      <i class="fa-solid fa-user text-lg mb-1"></i>Profile
    </button>
  </nav>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    const BDT_PER_USD = 122.21;

    // Helper to format currency in both BDT and USD ($)
    function fmtCurr(bdtAmount) {
      const usdAmount = (bdtAmount / BDT_PER_USD).toFixed(2);
      return `৳ ${bdtAmount.toFixed(2)} ($${usdAmount})`;
    }

    // Generate random 10-digit number for ID if missing
    function generate10DigitId() {
      return Math.floor(1000000000 + Math.random() * 9000000000).toString();
    }

    // Format current date as "DD MMM YYYY"
    function getJoinedDateFormatted() {
      const today = new Date();
      const day = today.getDate();
      const month = today.toLocaleString('default', { month: 'short' }).toUpperCase();
      const year = today.getFullYear();
      return `${day} ${month} ${year}`;
    }

    // Telegram User Object
    const tgUser = tg?.initDataUnsafe?.user;
    const user = {
      first_name: tgUser?.first_name || 'User',
      username: tgUser?.username || '',
      id: tgUser?.id ? String(tgUser.id) : generate10DigitId(),
      photo_url: tgUser?.photo_url || ''
    };

    // Available Ad Links Pool
    const availableAdLinks = [
      "https://youtube.com/shorts/QKQLl0VQw6I?si=oWzwF_JFcu9b96Gl",
      "https://youtube.com/shorts/RtUEhRlqcF4?si=QQaPldQUd7bAQvRu",
      "https://youtube.com/shorts/DXMFCrGSxcg?si=vhQdzi_JavwH5HaW",
      "https://youtube.com/shorts/ZV6ov1vN7p0?si=sEl3DHCBwzSh_jMr",
      "https://youtube.com/shorts/Z_khK3dd7bw?si=sBPm_crQ-La2YpIc",
      "https://youtube.com/shorts/xelHWngAHBk?si=zhAEOkY_vulRJRow",
      "https://youtube.com/shorts/gRNG27bz030?si=_I99Ip5eaeGvcPeC",
      "https://youtube.com/shorts/5ZKCfwyWnsU?si=QyztD7LJUA8d8tQk",
      "https://youtube.com/shorts/u49VfbSJ8-o?si=rKqtyg1gVMitdY0g",
      "https://youtube.com/shorts/XUXIstcmVuw?si=sEjXEGGMsIKzQ4iq"
    ];
    
    // User State
    const userState = {
      balance: 0.00,
      withdrawn: 0.00,
      totalEarned: 0.00,
      referrals: 0,
      adsWatched: 0,
      activeReferTab: 'leaderboard',
      myReferralsList: [],
      selectedMethod: 'bkash',
      showRulesModal: false,
      tasks: {
        welcome: { title: 'Welcome bonus', reward: 50.00, link: 'https://t.me/TaskPayBDTasks', status: 'join', category: 'JOIN BONUS', type: 'tg', icon: 'telegram' },
        proof: { title: 'Payment Proof Channel', reward: 20.00, link: 'https://t.me/TaskPayBDOfficial', status: 'join', category: 'TELEGRAM', type: 'tg', icon: 'telegram' },
        youtube: { title: 'YouTube Channel', reward: 20.00, link: 'https://www.youtube.com/@TaskPayBD', status: 'join', category: 'YOUTUBE', type: 'external', icon: 'youtube' },
        official: { title: 'Official Channel', reward: 20.00, link: 'https://t.me/TaskPayBDUpdates', status: 'join', category: 'TELEGRAM', type: 'tg', icon: 'telegram' }
      }
    };

    // Leaderboard Data
    const defaultLeaderboard = [
      { name: "Jannat", count: 4993, avatar: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" },
      { name: "Arafat", count: 1849, avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=150&q=80" },
      { name: "Fahim", count: 610, avatar: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=150&q=80" },
      { name: "Nayeem", count: 325, avatar: "https://images.unsplash.com/photo-1522075469751-3a6694fb2f61?auto=format&fit=crop&w=150&q=80" },
      { name: "Sakib", count: 272, avatar: "https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?auto=format&fit=crop&w=150&q=80" },
      { name: "Anisha", count: 265, avatar: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=150&q=80" },
      { name: "Mim", count: 242, avatar: "https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=150&q=80" },
      { name: "Tania", count: 240, avatar: "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=150&q=80" },
      { name: "Nusaiba", count: 234, avatar: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=150&q=80" },
      { name: "Sumaiya", count: 229, avatar: "https://images.unsplash.com/photo-1488426862026-3ee34a7d66df?auto=format&fit=crop&w=150&q=80" }
    ];

    function renderAvatar(photoUrl, name) {
      if (photoUrl) {
        return `<img src="${photoUrl}" class="w-16 h-16 rounded-2xl border-2 border-white/40 object-cover shadow-md" />`;
      }
      const initial = name ? name.charAt(0).toUpperCase() : 'U';
      return `<div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-amber-400 to-rose-400 text-white font-extrabold text-2xl flex items-center justify-center shadow-lg border-2 border-white/40">${initial}</div>`;
    }

    // TAB NAVIGATION HANDLER
    function switchTab(tab) {
      const app = document.getElementById('app-content');
      
      const tabs = ['home', 'earn', 'refer', 'withdraw', 'profile'];
      tabs.forEach(t => {
        const btn = document.getElementById(`nav-${t}`);
        if (btn) {
          btn.className = (t === tab)
            ? 'flex flex-col items-center text-purple-600 text-xs font-medium btn-interactive'
            : 'flex flex-col items-center text-gray-400 text-xs font-medium btn-interactive';
        }
      });

      if (tab === 'home') app.innerHTML = renderHome();
      else if (tab === 'earn') app.innerHTML = renderEarn();
      else if (tab === 'refer') app.innerHTML = renderRefer();
      else if (tab === 'withdraw') app.innerHTML = renderWithdraw();
      else if (tab === 'profile') app.innerHTML = renderProfile();
    }

    // HOME TAB RENDER
    function renderHome() {
      const completedTasks = Object.values(userState.tasks).filter(t => t.status === 'done').length;
      const totalTasks = Object.keys(userState.tasks).length;
      const pendingTasks = totalTasks - completedTasks;
      const progressPercent = Math.round((completedTasks / totalTasks) * 100);

      return `
        <div class="bg-gradient-custom rounded-3xl p-5 text-white shadow-lg animate-slide-left">
          <div class="flex justify-between items-center mb-4">
            <div>
              <p class="text-xs text-white/80 font-medium">Welcome back 👋</p>
              <h1 class="text-2xl font-bold">${user.first_name}</h1>
            </div>
            ${renderAvatar(user.photo_url, user.first_name)}
          </div>
          <p class="text-xs text-white/80 font-medium uppercase tracking-wider">Total Balance</p>
          <p class="text-3xl font-extrabold my-1">${fmtCurr(userState.balance)}</p>
          <p class="text-xs text-white/90">📈 Total earned: ${fmtCurr(userState.totalEarned)}</p>
        </div>

        <div class="grid grid-cols-2 gap-3 animate-slide-right">
          <div onclick="switchTab('withdraw')" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center space-x-3 cursor-pointer btn-interactive">
            <div class="w-10 h-10 rounded-xl bg-purple-100 text-purple-600 flex items-center justify-center"><i class="fa-solid fa-wallet"></i></div>
            <div>
              <p class="font-bold text-sm">Withdraw</p>
              <p class="text-xs text-gray-400">Cash out</p>
            </div>
          </div>
          <div onclick="switchTab('refer')" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center space-x-3 cursor-pointer btn-interactive">
            <div class="w-10 h-10 rounded-xl bg-red-100 text-red-500 flex items-center justify-center"><i class="fa-solid fa-user-plus"></i></div>
            <div>
              <p class="font-bold text-sm">Refer</p>
              <p class="text-xs text-gray-400">${fmtCurr(50)} / friend</p>
            </div>
          </div>
        </div>

        <div class="bg-gradient-custom rounded-2xl p-4 text-white shadow-sm animate-slide-left">
          <div class="flex justify-between items-center mb-1">
            <div class="flex items-center space-x-2">
              <i class="fa-solid fa-circle-check"></i>
              <span class="font-bold text-sm">Daily Tasks</span>
            </div>
            <button onclick="switchTab('earn')" class="bg-white/20 px-3 py-1 rounded-full text-xs font-semibold backdrop-blur-md btn-interactive">View →</button>
          </div>
          <p class="text-xs text-white/80 mb-3">${pendingTasks > 0 ? pendingTasks + ' tasks pending' : 'All tasks completed!'}</p>
          <div class="w-full bg-black/20 rounded-full h-2 overflow-hidden">
            <div class="bg-white h-full" style="width: ${progressPercent}%"></div>
          </div>
          <div class="flex justify-between text-xs mt-2 text-white/90">
            <span>${completedTasks} completed</span>
            <span>${progressPercent}%</span>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3 animate-slide-right">
          <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
            <div class="w-8 h-8 rounded-full bg-purple-50 text-purple-600 flex items-center justify-center mb-2"><i class="fa-solid fa-users text-sm"></i></div>
            <p class="text-2xl font-bold text-gray-800">${userState.referrals}</p>
            <p class="text-xs text-gray-400 font-medium">Total Referrals</p>
          </div>
          <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
            <div class="w-8 h-8 rounded-full bg-pink-50 text-pink-500 flex items-center justify-center mb-2"><i class="fa-solid fa-trophy text-sm"></i></div>
            <p class="text-lg font-bold text-gray-800">${fmtCurr(userState.totalEarned)}</p>
            <p class="text-xs text-gray-400 font-medium">Total Earned</p>
          </div>
        </div>

        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-3 animate-slide-left">
          <div class="flex items-center space-x-2">
            <span class="text-xl">🎁</span>
            <h3 class="font-bold text-gray-800 text-base">How to earn</h3>
          </div>
          <ol class="space-y-3 text-xs text-gray-600">
            <li class="flex items-start gap-2.5">
              <span class="w-5 h-5 bg-purple-600 text-white rounded-full flex items-center justify-center font-bold text-[10px] flex-shrink-0 mt-0.5">1</span>
              <span>Watch rewarded video ads daily up to the limit.</span>
            </li>
            <li class="flex items-start gap-2.5">
              <span class="w-5 h-5 bg-purple-600 text-white rounded-full flex items-center justify-center font-bold text-[10px] flex-shrink-0 mt-0.5">2</span>
              <span>Complete simple tasks like joining channels and following pages.</span>
            </li>
            <li class="flex items-start gap-2.5">
              <span class="w-5 h-5 bg-purple-600 text-white rounded-full flex items-center justify-center font-bold text-[10px] flex-shrink-0 mt-0.5">3</span>
              <span>Invite friends with your referral link and get ${fmtCurr(50)} each.</span>
            </li>
          </ol>
        </div>
      `;
    }

    // EARN TAB RENDER
    function renderEarn() {
      const isCompleted = userState.adsWatched >= 10 || availableAdLinks.length === 0;

      return `
        <div class="bg-gradient-custom rounded-3xl p-5 text-white shadow-lg animate-slide-left">
          <p class="text-xs text-white/80 uppercase tracking-wider">Daily Ads</p>
          <div class="flex justify-between items-baseline my-1">
            <h1 class="text-3xl font-extrabold">Earn</h1>
            <span class="text-xs">Today's reward: <b class="text-sm">${fmtCurr(10)}</b> / ad</span>
          </div>
        </div>

        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-3 animate-slide-right">
          <div class="flex justify-between text-sm font-bold">
            <span>Daily Progress</span>
            <span class="text-purple-600">${userState.adsWatched} / 10 watched</span>
          </div>
          <div class="w-full bg-gray-100 rounded-full h-3">
            <div class="bg-purple-600 h-full rounded-full transition-all duration-300" style="width: ${(userState.adsWatched/10)*100}%"></div>
          </div>
          <button onclick="watchAd()" ${isCompleted ? 'disabled' : ''} class="w-full ${isCompleted ? 'bg-gray-300 text-gray-500 cursor-not-allowed' : 'bg-purple-600 text-white shadow-md btn-interactive'} font-bold py-3 rounded-xl">
            ${isCompleted ? '✓ All Ads Watched Today' : '▶ Watch'}
          </button>
        </div>

        <h3 class="font-bold text-gray-700 pt-2 flex items-center gap-1.5 animate-slide-left"><i class="fa-solid fa-circle-check text-purple-600"></i> Tasks</h3>
        
        <div class="space-y-3 animate-slide-left">
          ${renderTaskCard('welcome', 'bg-sky-100 text-sky-500')}
          ${renderTaskCard('proof', 'bg-blue-100 text-blue-500')}
          ${renderTaskCard('youtube', 'bg-red-100 text-red-600')}
          ${renderTaskCard('official', 'bg-blue-100 text-blue-500')}
        </div>
      `;
    }

    function renderTaskCard(key, iconColors) {
      const task = userState.tasks[key];
      let actionBtn = '';

      if (task.status === 'join') {
        actionBtn = `<button onclick="handleTaskAction('${key}')" class="bg-purple-50 text-purple-600 border border-purple-200 px-4 py-1.5 rounded-full text-xs font-bold flex items-center gap-1 btn-interactive">Join <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i></button>`;
      } else if (task.status === 'claim') {
        actionBtn = `<button onclick="handleTaskAction('${key}')" class="bg-green-600 text-white px-4 py-1.5 rounded-full text-xs font-bold shadow-md btn-interactive">Claim</button>`;
      } else {
        actionBtn = `<span class="bg-gray-100 text-gray-400 px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1"><i class="fa-solid fa-check"></i> Done</span>`;
      }

      return `
        <div class="bg-white p-4 rounded-2xl border border-gray-100 flex items-center justify-between shadow-sm">
          <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl ${iconColors} flex items-center justify-center text-lg">
              <i class="fa-brands fa-${task.icon}"></i>
            </div>
            <div>
              <p class="font-bold text-sm">${task.title}</p>
              <div class="flex items-center gap-2 mt-0.5">
                <span class="bg-purple-100 text-purple-600 text-[10px] font-bold px-2 py-0.5 rounded-md">+${fmtCurr(task.reward)}</span>
                <span class="bg-gray-100 text-gray-500 text-[9px] font-bold px-1.5 py-0.5 rounded uppercase">${task.category}</span>
              </div>
            </div>
          </div>
          ${actionBtn}
        </div>
      `;
    }

    function watchAd() {
      if (userState.adsWatched < 10 && availableAdLinks.length > 0) {
        const randomIndex = Math.floor(Math.random() * availableAdLinks.length);
        const selectedUrl = availableAdLinks.splice(randomIndex, 1)[0];

        window.open(selectedUrl, '_blank');

        userState.adsWatched += 1;
        userState.balance += 10.00;
        userState.totalEarned += 10.00;

        switchTab('earn');
      }
    }

    function handleTaskAction(key) {
      const task = userState.tasks[key];
      if (task.status === 'join') {
        if (task.type === 'tg' && tg?.openTelegramLink) {
          tg.openTelegramLink(task.link);
        } else {
          window.open(task.link, '_blank');
        }
        task.status = 'claim';
        switchTab('earn');
      } else if (task.status === 'claim') {
        task.status = 'done';
        userState.balance += task.reward;
        userState.totalEarned += task.reward;
        switchTab('earn');
      }
    }

    // REFER TAB RENDER
    function renderRefer() {
      const botReferralLink = `https://t.me/TaskPayBD_Bot?start=${user.id}`;
      const totalReferralEarnings = userState.referrals * 50.00;

      let currentBoard = [...defaultLeaderboard];
      const userBoardIndex = currentBoard.findIndex(item => item.isCurrentUser);
      if (userBoardIndex > -1) currentBoard.splice(userBoardIndex, 1);

      currentBoard.push({
        name: user.first_name,
        count: userState.referrals,
        avatar: user.photo_url,
        isCurrentUser: true
      });

      currentBoard.sort((a, b) => b.count - a.count);
      const top10Leaderboard = currentBoard.slice(0, 10);

      return `
        <div class="bg-gradient-custom rounded-3xl p-6 text-white text-center shadow-lg relative overflow-hidden animate-slide-left">
          <div class="w-12 h-12 bg-white/20 rounded-2xl mx-auto flex items-center justify-center text-2xl mb-2 backdrop-blur-sm">
            <i class="fa-solid fa-user-plus"></i>
          </div>
          <h2 class="text-2xl font-extrabold tracking-tight">Invite & Earn</h2>
          <p class="text-xs text-white/90 mt-1 font-medium">Get <b class="text-white">${fmtCurr(50)}</b> for every friend who joins</p>
          
          <div class="mt-4 bg-white/20 p-1.5 pl-4 rounded-full flex items-center justify-between text-xs backdrop-blur-md border border-white/20 shadow-inner">
            <span class="truncate pr-2 font-mono text-[11px] text-white/90">${botReferralLink}</span>
            <div class="flex items-center space-x-1 flex-shrink-0">
              <button onclick="copyReferLink('${botReferralLink}')" class="bg-white/30 hover:bg-white/40 text-white p-2 rounded-full transition btn-interactive">
                <i class="fa-regular fa-copy text-sm"></i>
              </button>
              <button onclick="shareReferLink('${botReferralLink}')" class="bg-white/30 hover:bg-white/40 text-white p-2 rounded-full transition btn-interactive">
                <i class="fa-solid fa-share-nodes text-sm"></i>
              </button>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3 animate-slide-right">
          <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 text-center">
            <p class="text-xs text-gray-400 font-medium">Total Referrals</p>
            <p class="text-3xl font-extrabold text-gray-800 my-1">${userState.referrals}</p>
          </div>
          <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 text-center">
            <p class="text-xs text-gray-400 font-medium">Total Earned</p>
            <p class="text-sm font-extrabold text-purple-600 my-1">${fmtCurr(totalReferralEarnings)}</p>
          </div>
        </div>

        <div class="bg-white p-1 rounded-2xl shadow-sm border border-gray-100 flex space-x-1 animate-slide-left">
          <button onclick="setReferTab('leaderboard')" class="flex-1 py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition-all btn-interactive ${userState.activeReferTab === 'leaderboard' ? 'btn-gradient text-white shadow' : 'text-gray-500 hover:text-gray-700'}">
            <i class="fa-solid fa-trophy"></i> Leaderboard
          </button>
          <button onclick="setReferTab('my_referrals')" class="flex-1 py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition-all btn-interactive ${userState.activeReferTab === 'my_referrals' ? 'btn-gradient text-white shadow' : 'text-gray-500 hover:text-gray-700'}">
            <i class="fa-solid fa-users"></i> Your Referrals
          </button>
        </div>

        <div class="animate-slide-right">
          ${userState.activeReferTab === 'leaderboard' ? renderLeaderboardView(top10Leaderboard) : renderMyReferralsView()}
        </div>
      `;
    }

    function renderLeaderboardView(board) {
      return `
        <div class="space-y-2.5">
          ${board.map((item, index) => {
            let rankBadge = `<span class="text-xs font-bold text-purple-600 w-6 text-center">#${index + 1}</span>`;
            let bgStyle = 'bg-white';

            if (index === 0) {
              rankBadge = `<span class="text-lg w-6 text-center">🥇</span>`;
              bgStyle = 'bg-gradient-to-r from-amber-50 to-orange-50 border-amber-200';
            } else if (index === 1) {
              rankBadge = `<span class="text-lg w-6 text-center">🥈</span>`;
              bgStyle = 'bg-gradient-to-r from-slate-50 to-gray-50 border-slate-200';
            } else if (index === 2) {
              rankBadge = `<span class="text-lg w-6 text-center">🥉</span>`;
              bgStyle = 'bg-gradient-to-r from-amber-900/5 to-amber-800/10 border-amber-300/40';
            }

            const avatarImg = item.avatar ? `<img src="${item.avatar}" class="w-10 h-10 rounded-full object-cover border border-purple-200 flex-shrink-0" />` : `<div class="w-10 h-10 rounded-full bg-purple-100 text-purple-700 font-bold flex items-center justify-center border border-purple-200 flex-shrink-0">${item.name.charAt(0)}</div>`;

            return `
              <div class="${bgStyle} p-3.5 rounded-2xl border shadow-sm flex items-center justify-between">
                <div class="flex items-center space-x-3 truncate">
                  ${rankBadge}
                  ${avatarImg}
                  <div class="truncate">
                    <p class="font-bold text-sm text-gray-800 truncate">${item.name} ${item.isCurrentUser ? '<span class="text-[10px] bg-purple-100 text-purple-600 px-1.5 py-0.5 rounded ml-1 font-bold">You</span>' : ''}</p>
                    <p class="text-[11px] text-gray-400">Top Referrer</p>
                  </div>
                </div>
                <div class="text-right flex-shrink-0 pl-2">
                  <p class="font-extrabold text-purple-700 text-sm">${item.count}</p>
                  <p class="text-[10px] text-gray-400 font-medium">Referrals</p>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderMyReferralsView() {
      if (userState.myReferralsList.length === 0) {
        return `
          <div class="bg-white p-8 rounded-3xl border border-dashed border-purple-200 text-center space-y-3 shadow-sm">
            <div class="w-14 h-14 bg-purple-50 text-purple-500 rounded-2xl mx-auto flex items-center justify-center text-2xl">
              <i class="fa-solid fa-user-group"></i>
            </div>
            <h3 class="font-bold text-gray-800 text-base">No referrals yet</h3>
            <p class="text-xs text-gray-400 max-w-xs mx-auto">Share your link with friends to start earning.</p>
          </div>
        `;
      }

      return `
        <div class="space-y-2.5">
          ${userState.myReferralsList.map(ref => `
            <div class="bg-white p-3.5 rounded-2xl border border-gray-100 shadow-sm flex items-center justify-between">
              <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-purple-100 text-purple-700 font-bold flex items-center justify-center border border-purple-200">
                  ${ref.name.charAt(0)}
                </div>
                <div>
                  <p class="font-bold text-sm text-gray-800">${ref.name}</p>
                  <p class="text-[11px] text-gray-400">Joined ${ref.date}</p>
                </div>
              </div>
              <span class="btn-gradient text-white px-3 py-1 rounded-full text-xs font-extrabold shadow-sm">+${fmtCurr(50)}</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    function setReferTab(tab) {
      userState.activeReferTab = tab;
      switchTab('refer');
    }

    function copyReferLink(link) {
      navigator.clipboard.writeText(link);
      if (tg?.showPopup) {
        tg.showPopup({ title: 'Success', message: 'Referral link copied to clipboard!', buttons: [{ type: 'ok' }] });
      }
    }

    function shareReferLink(link) {
      const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent('Join Bangla Task Hub and earn daily rewards!')}`;
      if (tg?.openTelegramLink) {
        tg.openTelegramLink(shareUrl);
      } else {
        window.open(shareUrl, '_blank');
      }
    }

    // WITHDRAW TAB RENDER
    function renderWithdraw() {
      // SVG Logos
      const bkashLogo = `<svg class="w-6 h-6 rounded-full flex-shrink-0" viewBox="0 0 100 100" fill="none"><rect width="100" height="100" rx="50" fill="#E2136E"/><path d="M72 32L53 50L75 68H57L44 57L31 68H23L42 50L25 32H41L50 42L60 32H72Z" fill="white"/></svg>`;
      const nagadLogo = `<svg class="w-6 h-6 rounded-full flex-shrink-0" viewBox="0 0 100 100" fill="none"><rect width="100" height="100" rx="50" fill="#F7921E"/><circle cx="50" cy="50" r="28" stroke="white" stroke-width="8"/><path d="M40 35L60 65M60 35L40 65" stroke="white" stroke-width="6" stroke-linecap="round"/></svg>`;
      const usdtLogo = `<svg class="w-6 h-6 rounded-full flex-shrink-0" viewBox="0 0 2000 2000"><circle cx="1000" cy="1000" r="1000" fill="#26A17B"/><path d="M1275 802.5v-135H725v135h200v130c-255 12-425 61-425 120s170 108 425 120v255h150v-255c255-12 425-61 425-120s-170-108-425-120v-130h200zm-275 322.5c-193 0-330-34-330-67.5s137-67.5 330-67.5 330 34 330 67.5-137 67.5-330 67.5z" fill="#FFF"/></svg>`;

      const getBtnStyle = (method) => {
        return userState.selectedMethod === method
          ? 'border-2 border-purple-600 bg-purple-50/50 text-gray-900 shadow-sm'
          : 'border border-gray-200 bg-gray-50/50 text-gray-700 hover:bg-gray-100';
      };

      const isUsdt = userState.selectedMethod === 'usdt';
      
      // Eligibility checking: 1020 BDT required for bKash/Nagad, $10 USD for USDT
      const requiredBdt = isUsdt ? (10 * BDT_PER_USD) : 1020;
      const isEligible = userState.balance >= requiredBdt;
      
      const buttonStyle = isEligible 
        ? 'bg-gradient-to-r from-purple-500 via-pink-500 to-orange-400 text-white shadow-lg cursor-pointer btn-interactive' 
        : 'bg-gray-300 text-gray-500 cursor-not-allowed';

      return `
        <div class="bg-gradient-custom rounded-3xl p-5 text-white shadow-lg animate-slide-left">
          <p class="text-xs text-white/80 uppercase">Available Balance</p>
          <h1 class="text-3xl font-extrabold my-1">${fmtCurr(userState.balance)}</h1>
          <p class="text-xs text-white/90">Min. withdrawal: 1020 ৳</p>
        </div>

        <div class="bg-white p-5 rounded-3xl shadow-sm border border-gray-100 space-y-5 animate-slide-right">
          <div class="flex items-center space-x-2 text-purple-800">
            <i class="fa-solid fa-arrow-down-to-line text-lg"></i>
            <h3 class="font-extrabold text-lg">Request Payout</h3>
          </div>
          
          <div>
            <label class="text-xs text-gray-800 font-bold block mb-2.5">Payment Method</label>
            <div class="grid grid-cols-3 gap-2">
              <button type="button" onclick="setMethod('bkash')" class="${getBtnStyle('bkash')} py-2 px-1 rounded-2xl font-bold flex items-center justify-center gap-1.5 btn-interactive text-xs">
                ${bkashLogo} <span>bKash</span>
              </button>
              <button type="button" onclick="setMethod('nagad')" class="${getBtnStyle('nagad')} py-2 px-1 rounded-2xl font-bold flex items-center justify-center gap-1.5 btn-interactive text-xs">
                ${nagadLogo} <span>Nagad</span>
              </button>
              <button type="button" onclick="setMethod('usdt')" class="${getBtnStyle('usdt')} py-2 px-1 rounded-2xl font-bold flex items-center justify-center gap-1.5 btn-interactive text-xs">
                ${usdtLogo} <span>USDT</span>
              </button>
            </div>
          </div>

          <div>
            <label class="text-xs text-gray-800 font-bold block mb-2">${isUsdt ? 'Wallet Address' : 'Account Number'}</label>
            <div class="relative flex items-center">
              ${isUsdt ? '<span class="absolute left-3.5 text-emerald-600 font-bold text-base">₮</span>' : ''}
              <input type="text" id="withdraw-account" placeholder="${isUsdt ? 'TXXXXXXXX...0xXXXX...' : '01XXXXXXXXX'}" class="w-full bg-gray-50 border border-gray-100 p-3.5 ${isUsdt ? 'pl-8' : 'pl-4'} rounded-2xl text-sm outline-none focus:border-purple-600 text-gray-800 font-medium">
            </div>
          </div>

          <div>
            <div class="flex justify-between items-center mb-2">
              <label class="text-xs text-gray-800 font-bold">${isUsdt ? 'Amount in $' : 'Amount in ৳'}</label>
              <span class="text-xs text-gray-400 font-medium">${isUsdt ? 'minimum 10$' : 'minimum 1020 ৳'}</span>
            </div>
            <div class="relative flex items-center">
              <span class="absolute left-4 text-gray-500 font-bold text-base">${isUsdt ? '$' : '৳'}</span>
              <input type="number" id="withdraw-amount" value="${isUsdt ? '10.00' : '1020'}" step="${isUsdt ? '0.01' : '1'}" class="w-full bg-gray-50 border border-gray-100 p-3.5 pl-8 rounded-2xl text-base outline-none focus:border-purple-600 font-extrabold text-gray-800">
            </div>
          </div>

          <button type="button" ${!isEligible ? 'disabled' : ''} onclick="processWithdrawal()" class="w-full font-bold py-4 rounded-2xl ${buttonStyle} text-base tracking-wide">
            ${isUsdt ? 'Request 10$' : 'Request 1020 ৳'}
          </button>
        </div>
      `;
    }

    function setMethod(method) {
      userState.selectedMethod = method;
      switchTab('withdraw');
    }

    function processWithdrawal() {
      const accountInput = document.getElementById('withdraw-account')?.value.trim() || '';
      const amountInput = parseFloat(document.getElementById('withdraw-amount')?.value || '0');

      if (userState.selectedMethod === 'usdt') {
        if (!accountInput || accountInput.length < 10) return;
        if (amountInput < 10) return;
        const amountInBdt = amountInput * BDT_PER_USD;
        if (userState.balance < amountInBdt) return;
      } else {
        const mobileRegex = /^01\d{9}$/;
        if (!mobileRegex.test(accountInput)) return;
        if (amountInput < 1020) return;
        if (userState.balance < amountInput) return;
      }

      openVerificationPage();
    }

    function openVerificationPage() {
      const app = document.getElementById('app-content');
      app.innerHTML = `
        <div class="bg-white rounded-3xl p-5 shadow-lg border border-gray-100 space-y-4 animate-slide-left">
          <div class="flex justify-between items-center border-b pb-3">
            <div class="flex items-center space-x-2">
              <div class="w-7 h-7 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center">
                <i class="fa-solid fa-shield-halved text-sm"></i>
              </div>
              <h2 class="text-base font-extrabold text-gray-800">Verify Transaction</h2>
            </div>
            <button onclick="switchTab('withdraw')" class="text-gray-400 hover:text-gray-600 text-lg font-bold btn-interactive">✕</button>
          </div>

          <div class="bg-purple-50/60 p-4 rounded-2xl border border-purple-100 text-xs space-y-2 text-purple-900">
            <p class="font-medium">To complete your withdrawal, please verify your transaction details.</p>
            <div class="flex items-center gap-1.5 font-bold text-gray-800">
              <span class="w-4 h-4 bg-emerald-500 text-white rounded-full flex items-center justify-center text-[10px]">✓</span>
              <span>Minimum Payout Satisfied</span>
            </div>
            <ul class="list-disc pl-4 space-y-1 text-gray-600 pt-1">
              <li>Ensure your details are accurate before proceeding.</li>
              <li>Once submitted, processing takes a few moments.</li>
            </ul>
          </div>

          <div class="bg-gray-50 p-4 rounded-2xl border border-gray-200 flex items-center justify-between">
            <div class="flex items-center space-x-3 truncate">
              <div class="w-10 h-10 rounded-full bg-purple-600 text-white flex items-center justify-center font-bold text-lg flex-shrink-0"><i class="fa-solid fa-clock"></i></div>
              <div class="truncate">
                <p class="font-extrabold text-purple-600 text-sm">Processing Withdrawal</p>
                <p class="text-xs text-gray-400">Request submitted successfully</p>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // PROFILE TAB RENDER
    function renderProfile() {
      const joinedDate = getJoinedDateFormatted();

      return `
        <div class="bg-profile-banner rounded-3xl p-6 text-white text-center shadow-lg animate-slide-left relative overflow-hidden">
          <div class="relative z-10">
            <div class="mx-auto w-20 h-20 mb-3 flex justify-center items-center">
              ${renderAvatar(user.photo_url, user.first_name)}
            </div>
            <h2 class="text-2xl font-extrabold">${user.first_name}</h2>
            <p class="text-xs text-white/80 mt-0.5">ID: ${user.id}</p>
          </div>
        </div>

        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-3 animate-slide-right">
          <div class="flex justify-between items-center py-2 border-b border-gray-100 text-sm">
            <span class="text-gray-500 font-medium">Joined Date</span>
            <span class="font-bold text-gray-800">${joinedDate}</span>
          </div>
          <div class="flex justify-between items-center py-2 border-b border-gray-100 text-sm">
            <span class="text-gray-500 font-medium">Total Balance</span>
            <span class="font-bold text-purple-600">${fmtCurr(userState.balance)}</span>
          </div>
          <div class="flex justify-between items-center py-2 border-b border-gray-100 text-sm">
            <span class="text-gray-500 font-medium">Withdrawn</span>
            <span class="font-bold text-gray-800">${fmtCurr(userState.withdrawn)}</span>
          </div>
          <div class="flex justify-between items-center py-2 text-sm">
            <span class="text-gray-500 font-medium">Referrals</span>
            <span class="font-bold text-gray-800">${userState.referrals}</span>
          </div>
        </div>
      `;
    }

    // Initialize application on load
    switchTab('home');
  </script>
</body>
</html>
