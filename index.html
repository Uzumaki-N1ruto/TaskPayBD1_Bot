<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bangla Task Hub</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f7f7fb; }
    .bg-gradient-custom { background: linear-gradient(135deg, #8A2387 0%, #E94057 50%, #F27121 100%); }
    .btn-gradient { background: linear-gradient(135deg, #8A2387 0%, #E94057 100%); }
    .bg-profile-banner { background: linear-gradient(135deg, #8E2DE2 0%, #F000FF 50%, #FF512F 100%); }
  </style>
</head>
<body class="text-gray-800 pb-20 select-none">

  <!-- DYNAMIC TAB CONTENT -->
  <main id="app-content" class="p-4 space-y-4 max-w-md mx-auto"></main>

  <!-- BOTTOM NAVIGATION BAR -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 flex justify-around py-2 max-w-md mx-auto shadow-lg z-50">
    <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-purple-600 text-xs font-medium">
      <i class="fa-solid fa-house text-lg mb-1"></i>Home
    </button>
    <button onclick="switchTab('earn')" id="nav-earn" class="flex flex-col items-center text-gray-400 text-xs font-medium">
      <i class="fa-solid fa-list-check text-lg mb-1"></i>Earn
    </button>
    <button onclick="switchTab('refer')" id="nav-refer" class="flex flex-col items-center text-gray-400 text-xs font-medium">
      <i class="fa-solid fa-users text-lg mb-1"></i>Refer
    </button>
    <button onclick="switchTab('withdraw')" id="nav-withdraw" class="flex flex-col items-center text-gray-400 text-xs font-medium">
      <i class="fa-solid fa-wallet text-lg mb-1"></i>Withdraw
    </button>
    <button onclick="switchTab('profile')" id="nav-profile" class="flex flex-col items-center text-gray-400 text-xs font-medium">
      <i class="fa-solid fa-user text-lg mb-1"></i>Profile
    </button>
  </nav>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    // Fetch user details dynamically from Telegram WebApp
    const tgUser = tg?.initDataUnsafe?.user;
    const user = {
      first_name: tgUser?.first_name || 'User',
      username: tgUser?.username || '',
      id: tgUser?.id || '8758031849',
      photo_url: tgUser?.photo_url || ''
    };
    
    // User State with initial zero completed tasks and balance
    const userState = {
      balance: 0.00,
      withdrawn: 0.00,
      totalEarned: 0.00,
      referrals: 0,
      adsWatched: 0,
      activeReferTab: 'leaderboard',
      myReferralsList: [],
      selectedMethod: 'bkash',
      tasks: {
        welcome: { title: 'Welcome bonus', reward: 50.00, link: 'https://t.me/TaskPayBDTasks', status: 'join', category: 'JOIN BONUS' },
        proof: { title: 'Payment Proof Channel', reward: 20.00, link: 'https://t.me/TaskPayBDOfficial', status: 'join', category: 'TELEGRAM' },
        giveaway: { title: 'Giveaway Channel', reward: 20.00, link: 'https://t.me/TaskPayBDOfficial', status: 'join', category: 'OTHER' },
        official: { title: 'Official Channel', reward: 20.00, link: 'https://t.me/TaskPayBDOfficial', status: 'join', category: 'TELEGRAM' }
      }
    };

    // Updated Leaderboard Data with the exact requested names
    const defaultLeaderboard = [
      { name: "Jannat", count: 4993, avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Jannat" },
      { name: "Arafat", count: 1849, avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Arafat" },
      { name: "Fahim", count: 610, avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Fahim" },
      { name: "Nayeem", count: 325, avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Nayeem" },
      { name: "Sakib", count: 272, avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Sakib" },
      { name: "Anisha", count: 265, avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Anisha" },
      { name: "Mim", count: 242, avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Mim" },
      { name: "Tania", count: 240, avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Tania" },
      { name: "Nusaiba", count: 234, avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Nusaiba" },
      { name: "Sumaiya", count: 229, avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Sumaiya" }
    ];

    function renderAvatar(photoUrl, name) {
      if (photoUrl) {
        return `<img src="${photoUrl}" class="w-16 h-16 rounded-2xl border-2 border-white/40 object-cover shadow-md" />`;
      }
      const initial = name ? name.charAt(0).toUpperCase() : 'U';
      return `<div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-amber-400 to-rose-400 text-white font-extrabold text-2xl flex items-center justify-center shadow-lg border-2 border-white/40">${initial}</div>`;
    }

    function renderHome() {
      const completedTasks = Object.values(userState.tasks).filter(t => t.status === 'done').length;
      const totalTasks = Object.keys(userState.tasks).length;
      const pendingTasks = totalTasks - completedTasks;
      const progressPercent = Math.round((completedTasks / totalTasks) * 100);

      return `
        <div class="bg-gradient-custom rounded-3xl p-5 text-white shadow-lg">
          <div class="flex justify-between items-center mb-4">
            <div>
              <p class="text-xs text-white/80 font-medium">Welcome back 👋</p>
              <h1 class="text-2xl font-bold">${user.first_name}</h1>
            </div>
            ${renderAvatar(user.photo_url, user.first_name)}
          </div>
          <p class="text-xs text-white/80 font-medium uppercase tracking-wider">Total Balance</p>
          <p class="text-4xl font-extrabold my-1">৳ ${userState.balance.toFixed(2)}</p>
          <p class="text-xs text-white/90">📈 Total earned: ৳ ${userState.totalEarned.toFixed(2)}</p>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div onclick="switchTab('withdraw')" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center space-x-3 cursor-pointer">
            <div class="w-10 h-10 rounded-xl bg-purple-100 text-purple-600 flex items-center justify-center"><i class="fa-solid fa-wallet"></i></div>
            <div>
              <p class="font-bold text-sm">Withdraw</p>
              <p class="text-xs text-gray-400">Cash out</p>
            </div>
          </div>
          <div onclick="switchTab('refer')" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex items-center space-x-3 cursor-pointer">
            <div class="w-10 h-10 rounded-xl bg-red-100 text-red-500 flex items-center justify-center"><i class="fa-solid fa-user-plus"></i></div>
            <div>
              <p class="font-bold text-sm">Refer</p>
              <p class="text-xs text-gray-400">৳ 50.00 / friend</p>
            </div>
          </div>
        </div>

        <div class="bg-gradient-custom rounded-2xl p-4 text-white shadow-sm">
          <div class="flex justify-between items-center mb-1">
            <div class="flex items-center space-x-2">
              <i class="fa-solid fa-circle-check"></i>
              <span class="font-bold text-sm">Daily Tasks</span>
            </div>
            <button onclick="switchTab('earn')" class="bg-white/20 px-3 py-1 rounded-full text-xs font-semibold backdrop-blur-md">View →</button>
          </div>
          <p class="text-xs text-white/80 mb-3">${pendingTasks > 0 ? pendingTasks + ' tasks pending' : 'All tasks completed!'}</p>
          <div class="w-full bg-black/20 rounded-full h-2 overflow-hidden">
            <div class="bg-white h-full" style="width: ${progressPercent}%"></div>
          </div>
          <div class="flex justify-between text-xs mt-2 text-white/90">
            <span>${completedTasks} completed</span>
            <span>${progressPercent}%</span>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
            <div class="w-8 h-8 rounded-full bg-purple-50 text-purple-600 flex items-center justify-center mb-2"><i class="fa-solid fa-users text-sm"></i></div>
            <p class="text-2xl font-bold text-gray-800">${userState.referrals}</p>
            <p class="text-xs text-gray-400 font-medium">Total Referrals</p>
          </div>
          <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100">
            <div class="w-8 h-8 rounded-full bg-pink-50 text-pink-500 flex items-center justify-center mb-2"><i class="fa-solid fa-trophy text-sm"></i></div>
            <p class="text-2xl font-bold text-gray-800">৳ ${userState.totalEarned.toFixed(2)}</p>
            <p class="text-xs text-gray-400 font-medium">Total Earned</p>
          </div>
        </div>
      `;
    }

    function renderEarn() {
      return `
        <div class="bg-gradient-custom rounded-3xl p-5 text-white shadow-lg">
          <p class="text-xs text-white/80 uppercase tracking-wider">Daily Ads</p>
          <div class="flex justify-between items-baseline my-1">
            <h1 class="text-3xl font-extrabold">Earn</h1>
            <span class="text-sm">Today's reward: <b class="text-lg">৳ 10.00</b> / ad</span>
          </div>
        </div>

        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 space-y-3">
          <div class="flex justify-between text-sm font-bold">
            <span>Daily Progress</span>
            <span class="text-purple-600">${userState.adsWatched} / 10 watched</span>
          </div>
          <div class="w-full bg-gray-100 rounded-full h-3">
            <div class="bg-purple-600 h-full rounded-full" style="width: ${(userState.adsWatched/10)*100}%"></div>
          </div>
          <button onclick="watchAd()" class="w-full bg-purple-600 text-white font-bold py-3 rounded-xl shadow-md">
            ▶ Watch
          </button>
        </div>

        <h3 class="font-bold text-gray-700 pt-2 flex items-center gap-1.5"><i class="fa-solid fa-circle-check text-purple-600"></i> Tasks</h3>
        
        <div class="space-y-3">
          ${renderTaskCard('welcome', 'gift', 'bg-orange-100 text-orange-500')}
          ${renderTaskCard('proof', 'paper-plane', 'bg-blue-100 text-blue-500')}
          ${renderTaskCard('giveaway', 'coins', 'bg-purple-100 text-purple-500')}
          ${renderTaskCard('official', 'paper-plane', 'bg-blue-100 text-blue-500')}
        </div>
      `;
    }

    function renderTaskCard(key, icon, iconColors) {
      const task = userState.tasks[key];
      let actionBtn = '';

      if (task.status === 'join') {
        actionBtn = `<button onclick="handleTaskAction('${key}')" class="bg-purple-50 text-purple-600 border border-purple-200 px-4 py-1.5 rounded-full text-xs font-bold flex items-center gap-1">Join <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i></button>`;
      } else if (task.status === 'claim') {
        actionBtn = `<button onclick="handleTaskAction('${key}')" class="bg-green-600 text-white px-4 py-1.5 rounded-full text-xs font-bold shadow-md">Claim</button>`;
      } else {
        actionBtn = `<span class="bg-gray-100 text-gray-400 px-3 py-1.5 rounded-full text-xs font-bold flex items-center gap-1"><i class="fa-solid fa-check"></i> Done</span>`;
      }

      return `
        <div class="bg-white p-4 rounded-2xl border border-gray-100 flex items-center justify-between shadow-sm">
          <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl ${iconColors} flex items-center justify-center text-lg"><i class="fa-solid fa-${icon}"></i></div>
            <div>
              <p class="font-bold text-sm">${task.title}</p>
              <div class="flex items-center gap-2 mt-0.5">
                <span class="bg-purple-100 text-purple-600 text-[10px] font-bold px-2 py-0.5 rounded-md">+৳ ${task.reward.toFixed(2)}</span>
                <span class="bg-gray-100 text-gray-500 text-[9px] font-bold px-1.5 py-0.5 rounded uppercase">${task.category}</span>
              </div>
            </div>
          </div>
          ${actionBtn}
        </div>
      `;
    }

    function handleTaskAction(key) {
      const task = userState.tasks[key];
      if (task.status === 'join') {
        if (tg?.openTelegramLink) {
          tg.openTelegramLink(task.link);
        } else {
          window.open(task.link, '_blank');
        }
        task.status = 'claim';
        switchTab('earn');
      } else if (task.status === 'claim') {
        task.status = 'done';
        userState.balance += task.reward;
        userState.totalEarned += task.reward;
        switchTab('earn');
      }
    }

    function renderRefer() {
      const botReferralLink = `https://t.me/TaskPayBD_Bot?start=${user.id}`;
      const totalReferralEarnings = userState.referrals * 50.00;

      let currentBoard = [...defaultLeaderboard];
      const userBoardIndex = currentBoard.findIndex(item => item.isCurrentUser);
      if (userBoardIndex > -1) currentBoard.splice(userBoardIndex, 1);

      currentBoard.push({
        name: user.first_name,
        count: userState.referrals,
        avatar: user.photo_url,
        isCurrentUser: true
      });

      currentBoard.sort((a, b) => b.count - a.count);
      const top10Leaderboard = currentBoard.slice(0, 10);

      return `
        <div class="bg-gradient-custom rounded-3xl p-6 text-white text-center shadow-lg relative overflow-hidden">
          <div class="w-12 h-12 bg-white/20 rounded-2xl mx-auto flex items-center justify-center text-2xl mb-2 backdrop-blur-sm">
            <i class="fa-solid fa-user-plus"></i>
          </div>
          <h2 class="text-2xl font-extrabold tracking-tight">Invite & Earn</h2>
          <p class="text-xs text-white/90 mt-1 font-medium">Get <b class="text-white">৳ 50.00</b> for every friend who joins</p>
          
          <div class="mt-4 bg-white/20 p-1.5 pl-4 rounded-full flex items-center justify-between text-xs backdrop-blur-md border border-white/20 shadow-inner">
            <span class="truncate pr-2 font-mono text-[11px] text-white/90">${botReferralLink}</span>
            <div class="flex items-center space-x-1 flex-shrink-0">
              <button onclick="copyReferLink('${botReferralLink}')" class="bg-white/30 hover:bg-white/40 text-white p-2 rounded-full transition">
                <i class="fa-regular fa-copy text-sm"></i>
              </button>
              <button onclick="shareReferLink('${botReferralLink}')" class="bg-white/30 hover:bg-white/40 text-white p-2 rounded-full transition">
                <i class="fa-solid fa-share-nodes text-sm"></i>
              </button>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 text-center">
            <p class="text-xs text-gray-400 font-medium">Total Referrals</p>
            <p class="text-3xl font-extrabold text-gray-800 my-1">${userState.referrals}</p>
          </div>
          <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 text-center">
            <p class="text-xs text-gray-400 font-medium">Total Earned</p>
            <p class="text-3xl font-extrabold text-purple-600 my-1">৳ ${totalReferralEarnings.toFixed(2)}</p>
          </div>
        </div>

        <div class="bg-white p-1 rounded-2xl shadow-sm border border-gray-100 flex space-x-1">
          <button onclick="setReferTab('leaderboard')" class="flex-1 py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition-all ${userState.activeReferTab === 'leaderboard' ? 'btn-gradient text-white shadow' : 'text-gray-500 hover:text-gray-700'}">
            <i class="fa-solid fa-trophy"></i> Leaderboard
          </button>
          <button onclick="setReferTab('my_referrals')" class="flex-1 py-2.5 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition-all ${userState.activeReferTab === 'my_referrals' ? 'btn-gradient text-white shadow' : 'text-gray-500 hover:text-gray-700'}">
            <i class="fa-solid fa-users"></i> Your Referrals
          </button>
        </div>

        <div>
          ${userState.activeReferTab === 'leaderboard' ? renderLeaderboardView(top10Leaderboard) : renderMyReferralsView()}
        </div>
      `;
    }

    function renderLeaderboardView(board) {
      return `
        <div class="space-y-2.5">
          ${board.map((item, index) => {
            let rankBadge = `<span class="text-xs font-bold text-purple-600 w-6 text-center">#${index + 1}</span>`;
            let bgStyle = 'bg-white';

            if (index === 0) {
              rankBadge = `<span class="text-lg w-6 text-center">🥇</span>`;
              bgStyle = 'bg-gradient-to-r from-amber-50 to-orange-50 border-amber-200';
            } else if (index === 1) {
              rankBadge = `<span class="text-lg w-6 text-center">🥈</span>`;
              bgStyle = 'bg-gradient-to-r from-slate-50 to-gray-50 border-slate-200';
            } else if (index === 2) {
              rankBadge = `<span class="text-lg w-6 text-center">🥉</span>`;
              bgStyle = 'bg-gradient-to-r from-amber-900/5 to-amber-800/10 border-amber-300/40';
            }

            return `
              <div class="${bgStyle} p-3.5 rounded-2xl border shadow-sm flex items-center justify-between">
                <div class="flex items-center space-x-3 truncate">
                  ${rankBadge}
                  <div class="w-10 h-10 rounded-full bg-purple-100 flex items-center justify-center text-purple-700 font-bold border border-purple-200 flex-shrink-0">
                    ${item.name.charAt(0)}
                  </div>
                  <div class="truncate">
                    <p class="font-bold text-sm text-gray-800 truncate">${item.name} ${item.isCurrentUser ? '<span class="text-[10px] bg-purple-100 text-purple-600 px-1.5 py-0.5 rounded ml-1 font-bold">You</span>' : ''}</p>
                    <p class="text-[11px] text-gray-400">Top Referrer</p>
                  </div>
                </div>
                <div class="text-right flex-shrink-0 pl-2">
                  <p class="font-extrabold text-purple-700 text-sm">${item.count}</p>
                  <p class="text-[10px] text-gray-400 font-medium">Referrals</p>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderMyReferralsView() {
      if (userState.myReferralsList.length === 0) {
        return `
          <div class="bg-white p-8 rounded-3xl border border-dashed border-purple-200 text-center space-y-3 shadow-sm">
            <div class="w-14 h-14 bg-purple-50 text-purple-500 rounded-2xl mx-auto flex items-center justify-center text-2xl">
              <i class="fa-solid fa-user-group"></i>
            </div>
            <h3 class="font-bold text-gray-800 text-base">No referrals yet</h3>
            <p class="text-xs text-gray-400 max-w-xs mx-auto">Share your link with friends to start earning.</p>
          </div>
        `;
      }

      return `
        <div class="space-y-2.5">
          ${userState.myReferralsList.map(ref => `
            <div class="bg-white p-3.5 rounded-2xl border border-gray-100 shadow-sm flex items-center justify-between">
              <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-full bg-purple-100 text-purple-700 font-bold flex items-center justify-center border border-purple-200">
                  ${ref.name.charAt(0)}
                </div>
                <div>
                  <p class="font-bold text-sm text-gray-800">${ref.name}</p>
                  <p class="text-[11px] text-gray-400">Joined ${ref.date}</p>
                </div>
              </div>
              <span class="btn-gradient text-white px-3 py-1 rounded-full text-xs font-extrabold shadow-sm">+৳ 50.00</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    function setReferTab(tab) {
      userState.activeReferTab = tab;
      switchTab('refer');
    }

    function copyReferLink(link) {
      navigator.clipboard.writeText(link);
      if (tg?.showPopup) {
        tg.showPopup({ title: 'Success', message: 'Referral link copied to clipboard!', buttons: [{ type: 'ok' }] });
      } else {
        alert('Referral link copied!');
      }
    }

    function shareReferLink(link) {
      const shareUrl = `https://t.me/share/url?url=${encodeURIComponent(link)}&text=${encodeURIComponent('Join Bangla Task Hub and earn daily rewards!')}`;
      if (tg?.openTelegramLink) {
        tg.openTelegramLink(shareUrl);
      } else {
        window.open(shareUrl, '_blank');
      }
    }

    function renderWithdraw() {
      return `
        <div class="bg-gradient-custom rounded-3xl p-5 text-white shadow-lg">
          <p class="text-xs text-white/80 uppercase">Available Balance</p>
          <h1 class="text-4xl font-extrabold my-1">৳ ${userState.balance.toFixed(2)}</h1>
          <p class="text-xs text-white/90">Min. withdrawal: ৳ 1,020.00</p>
        </div>

        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 space-y-4">
          <h3 class="font-bold text-gray-800 flex items-center gap-2"><i class="fa-solid fa-download text-purple-600"></i> Request Payout</h3>
          
          <div>
            <label class="text-xs text-gray-500 font-bold block mb-2">Payment Method</label>
            <div class="grid grid-cols-2 gap-3">
              <button onclick="setMethod('bkash')" id="btn-bkash" class="border-2 border-pink-500 bg-pink-50 py-2.5 rounded-xl font-bold text-pink-600 flex items-center justify-center gap-2">bKash</button>
              <button onclick="setMethod('nagad')" id="btn-nagad" class="border border-gray-200 py-2.5 rounded-xl font-bold text-gray-600 flex items-center justify-center gap-2">Nagad</button>
            </div>
          </div>

          <div>
            <label class="text-xs text-gray-500 font-bold block mb-1">Account Number</label>
            <input type="text" placeholder="01XXXXXXXXX" class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl text-sm outline-none focus:border-purple-600">
          </div>

          <div>
            <label class="text-xs text-gray-500 font-bold block mb-1">Amount (Min: ৳ 1,020.00)</label>
            <input type="number" value="1020" class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl text-sm outline-none focus:border-purple-600 font-bold">
          </div>

          <button onclick="alert('Withdrawal request submitted!')" class="w-full bg-gradient-custom text-white font-bold py-3.5 rounded-xl shadow-lg">
            Request ৳ 1,020.00
          </button>
        </div>
      `;
    }

    // PROFILE PAGE DESIGN
    function renderProfile() {
      // Dynamic counter: defaults to 0, goes up by 1 per completed task
      const completedTasksCount = Object.values(userState.tasks).filter(t => t.status === 'done').length;
      const displayUsername = user.username ? `@${user.username}` : '@user';

      return `
        <!-- HEADER CARD -->
        <div class="bg-profile-banner rounded-3xl p-6 text-white text-center shadow-md relative overflow-hidden flex flex-col items-center justify-center min-h-[220px]">
          <div class="mb-3">
            ${renderAvatar(user.photo_url, user.first_name)}
          </div>

    }

    function openWatchBot() {
      if (tg?.openTelegramLink) {
        tg.openTelegramLink('https://t.me/TaskPayBD_Bot');
      } else {
        window.open('https://t.me/TaskPayBD_Bot', '_blank');
      }
    }

    function setMethod(method) {
      userState.selectedMethod = method;
      const bkashBtn = document.getElementById('btn-bkash');
      const nagadBtn = document.getElementById('btn-nagad');
      
      if (method === 'bkash') {
        bkashBtn.className = "border-2 border-pink-500 bg-pink-50 py-2.5 rounded-xl font-bold text-pink-600 flex items-center justify-center gap-2";
        nagadBtn.className = "border border-gray-200 py-2.5 rounded-xl font-bold text-gray-600 flex items-center justify-center gap-2";
      } else {
        nagadBtn.className = "border-2 border-orange-500 bg-orange-50 py-2.5 rounded-xl font-bold text-orange-600 flex items-center justify-center gap-2";
        bkashBtn.className = "border border-gray-200 py-2.5 rounded-xl font-bold text-gray-600 flex items-center justify-center gap-2";
      }
    }

    function switchTab(tab) {
      const app = document.getElementById('app-content');
      document.querySelectorAll('nav button').forEach(b => {
        b.classList.remove('text-purple-600');
        b.classList.add('text-gray-400');
      });
      document.getElementById(`nav-${tab}`).classList.add('text-purple-600');

      if (tab === 'home') app.innerHTML = renderHome();
      else if (tab === 'earn') app.innerHTML = renderEarn();
      else if (tab === 'refer') app.innerHTML = renderRefer();
      else if (tab === 'withdraw') app.innerHTML = renderWithdraw();
      else if (tab === 'profile') app.innerHTML = renderProfile();
    }

    function watchAd() {
      if (userState.adsWatched < 10) {
        userState.adsWatched++;
        userState.balance += 10.00;
        userState.totalEarned += 10.00;
        switchTab('earn');
      }
    }

    // Default tab load
    switchTab('profile');
